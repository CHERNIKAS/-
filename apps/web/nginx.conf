server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Запросы к API уходят в свой контейнер, всё остальное отдаётся как статика.
  # Так на домене живёт один маршрут, а не два, и Traefik не нужно учить
  # разбирать пути.
  location /api/ {
    # Имя разрешается на каждый запрос через DNS Docker: иначе nginx
    # запоминает IP контейнера при старте, и после пересборки API отвечает
    # 502, хотя сам API жив. Переменная в proxy_pass как раз и включает
    # позднее разрешение имени.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream costnote-api:3000;
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Мини-апп — одностраничное приложение: любой путь отдаёт index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
