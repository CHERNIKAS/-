server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Запросы к API уходят в свой контейнер, всё остальное отдаётся как статика.
  # Так на домене живёт один маршрут, а не два, и Traefik не нужно учить
  # разбирать пути.
  location /api/ {
    proxy_pass http://costnote-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Мини-апп — одностраничное приложение: любой путь отдаёт index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
