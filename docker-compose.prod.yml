name: costnote

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE}
      DEFAULT_REMINDER_HOUR: ${DEFAULT_REMINDER_HOUR}
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BOT_TOKEN: ${BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE}
      DEFAULT_REMINDER_HOUR: ${DEFAULT_REMINDER_HOUR}
    networks: [internal]

  # Приложение: статика Mini App плюс проксирование /api в соседний контейнер.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    networks: [internal, coolify]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.costnote-redirect.rule: Host(`costnote.site`) || Host(`www.costnote.site`)
      traefik.http.routers.costnote-redirect.entrypoints: http
      traefik.http.routers.costnote-redirect.middlewares: costnote-https-only
      traefik.http.middlewares.costnote-https-only.redirectscheme.scheme: https
      traefik.http.middlewares.costnote-https-only.redirectscheme.permanent: "true"
      traefik.http.routers.costnote-web.rule: Host(`costnote.site`) || Host(`www.costnote.site`)
      traefik.http.routers.costnote-web.entrypoints: https
      traefik.http.routers.costnote-web.tls: "true"
      traefik.http.routers.costnote-web.tls.certresolver: letsencrypt
      traefik.http.services.costnote-web.loadbalancer.server.port: "80"

volumes:
  pgdata:
  redisdata:

networks:
  internal:
  coolify:
    external: true
