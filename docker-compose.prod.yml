name: costnote

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]

  # Временная заглушка: проверяет, что домен и сертификат подхватились.
  # Заменится приложением, как только оно будет готово.
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./placeholder:/usr/share/nginx/html:ro
    networks: [internal, coolify]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.costnote-redirect.rule: Host(`costnote.site`) || Host(`www.costnote.site`)
      traefik.http.routers.costnote-redirect.entrypoints: http
      traefik.http.routers.costnote-redirect.middlewares: costnote-https-only
      traefik.http.middlewares.costnote-https-only.redirectscheme.scheme: https
      traefik.http.middlewares.costnote-https-only.redirectscheme.permanent: "true"
      traefik.http.routers.costnote-web.rule: Host(`costnote.site`) || Host(`www.costnote.site`)
      traefik.http.routers.costnote-web.entrypoints: https
      traefik.http.routers.costnote-web.tls: "true"
      traefik.http.routers.costnote-web.tls.certresolver: letsencrypt
      traefik.http.services.costnote-web.loadbalancer.server.port: "80"

volumes:
  pgdata:
  redisdata:

networks:
  internal:
  coolify:
    external: true
